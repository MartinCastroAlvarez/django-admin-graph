name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --all-extras
      - name: ruff check
        run: poetry run ruff check django_admin_graph tests examples
      - name: ruff format --check
        run: poetry run ruff format --check django_admin_graph tests examples
      - name: mypy
        run: poetry run mypy django_admin_graph
      - name: bandit
        run: poetry run bandit -c pyproject.toml -q -r django_admin_graph

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root --all-extras
      - name: pip-audit
        run: |
          # Upgrade pip first so its own advisories don't fail the audit —
          # pip is tooling, not a shipped dependency.
          poetry run python -m pip install --upgrade -q pip
          poetry run pip-audit

  test:
    name: Tests (Python ${{ matrix.python-version }} / Django ${{ matrix.django }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        django: ["4.2", "5.0", "5.1", "5.2"]
        exclude:
          # Django 4.2 gained Python 3.13 support late in its 4.2.x line;
          # skip the pair conservatively, as the rest of the family does.
          - python-version: "3.13"
            django: "4.2"
        include:
          # Django 6.x requires Python >= 3.12.
          - python-version: "3.12"
            django: "6.0"
          - python-version: "3.13"
            django: "6.0"
          - python-version: "3.12"
            django: "6.1"
          - python-version: "3.13"
            django: "6.1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --all-extras
      # Swap Django through the venv's pip, not `poetry add`: the project's
      # declared Python range (>=3.11) would make poetry refuse Django 6.x.
      - name: Pin Django version (${{ matrix.django }})
        run: poetry run pip install --upgrade "django==${{ matrix.django }}.*"
      - name: Show resolved Django
        run: poetry run python -c "import django; print('Django', django.get_version())"
      - name: Run pytest
        run: poetry run pytest -q
      - name: Smoke-test the command
        run: |
          poetry run python examples/quickstart/manage.py admin_graph --format mermaid --app library > /tmp/admin.mmd
          grep -q "erDiagram" /tmp/admin.mmd
