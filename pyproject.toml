[tool.poetry]
name = "django-admin-graph"
version = "0.1.0"
description = "Introspect a Django AdminSite into a typed, versioned, JSON-serialisable graph of apps, models, relations, ModelAdmins, actions and permissions — filtered by the requesting user's admin permissions."
authors = ["Martín Castro Álvarez <martincastro.10.5@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/MartinCastroAlvarez/django-admin-graph"
repository = "https://github.com/MartinCastroAlvarez/django-admin-graph"
documentation = "https://github.com/MartinCastroAlvarez/django-admin-graph#readme"
keywords = [
    "django",
    "django-admin",
    "graph",
    "introspection",
    "erd",
    "mermaid",
    "graphviz",
    "schema",
    "ai-agents",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
packages = [{ include = "django_admin_graph" }]
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "^3.11"
# Django LTS range: 4.2 LTS → 5.0 → 5.1 → 5.2 LTS → 6.0 → 6.1. Bump the upper
# bound when 7.0 ships and the CI matrix passes.
django = ">=4.2,<7.0"
# Optional: ``to_networkx`` exporter. Install with
# ``pip install "django-admin-graph[networkx]"``.
networkx = { version = "^3.2", optional = true }

[tool.poetry.extras]
networkx = ["networkx"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-django = "^4.8"
pytest-cov = ">=5,<8"
ruff = ">=0.6"
mypy = "^1.10 || ^2.0"
django-stubs = { version = ">=5.0", extras = ["compatible-mypy"] }
bandit = "^1.7"
pip-audit = "^2.7"
jsonschema = "^4.0"
networkx = "^3.2"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------- #
# Ruff — lint + format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/test_project/migrations"]

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "S",            # bandit-style security
    "DJ",           # django-specific
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RET",          # returns
    "PIE",          # misc
]
ignore = [
    "S101",   # asserts are fine in tests
    "DJ001",  # nullable charfield warning — opt-in elsewhere
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "S107"]
"examples/**/*.py" = ["S101", "DJ001"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["django_admin_graph", "tests"]

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.test_project.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=django_admin_graph",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:django.*",
    # Django 5.0/5.1 warn about forms.URLField's default scheme — the test
    # project's URLField, not this package.
    "ignore:The default scheme will be changed:PendingDeprecationWarning",
    "ignore:The default scheme will be changed:DeprecationWarning",
]

# --------------------------------------------------------------------------- #
# MyPy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.test_project.settings"

# --------------------------------------------------------------------------- #
# Coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["django_admin_graph"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# --------------------------------------------------------------------------- #
# Bandit — the shipped package is the security-relevant code; tests and
# examples are excluded.
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["tests", "examples", ".venv", "node_modules", "build", "dist"]
